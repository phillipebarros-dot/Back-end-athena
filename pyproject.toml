[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-backend"
version = "0.1.0"
description = "Backend Python para Athena — agente LLM de mídia e planejamento (Opus Múltipla)"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Phillipe Barros", email = "phillipe.barros@grupoom.com.br"},
    {name = "Camilo Ferreira", email = "camilo.ferreira@grupoom.com.br"},
    {name = "Wesley Macena", email = "wesley.macena@grupoom.com.br"},
    {name = "Andrei Nogueira", email = "andrei@grupoom.com.br"},
]
dependencies = [
    # === Core ===
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "python-dotenv>=1.0",

    # === LLM Agent ===
    "langgraph>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.3",
    "langgraph-checkpoint-postgres>=2.0",

    # === Data ===
    "google-cloud-bigquery>=3.25",
    "psycopg[binary,pool]>=3.2",

    # === Utilities ===
    "openai>=1.50",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    "cachetools>=5.4",
    "gspread>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
observability = [
    "langsmith>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
